<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- lane 1: real time -->
  <text x="70" y="55" font-size="14.5" fill="#334155" font-weight="700">真实时间</text>
  <line x1="70" y1="100" x2="750" y2="100" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="100" y="76" width="150" height="30" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="175" y="95" font-size="13.5" fill="#1e3a8a" text-anchor="middle">T1：转账，提交成功</text>

  <rect x="330" y="76" width="150" height="30" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="405" y="95" font-size="13.5" fill="#713f12" text-anchor="middle">当面告知朋友：钱到了</text>
  <text x="405" y="125" font-size="11.5" fill="#a16207" text-anchor="middle">（系统之外的因果通道）</text>

  <rect x="560" y="76" width="150" height="30" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="635" y="95" font-size="13.5" fill="#1e3a8a" text-anchor="middle">T2：朋友查余额</text>

  <!-- lane 2: chosen serial order -->
  <text x="70" y="215" font-size="14.5" fill="#334155" font-weight="700">系统选定的串行序</text>
  <line x1="70" y1="260" x2="750" y2="260" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="180" y="236" width="150" height="30" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="255" y="255" font-size="13.5" fill="#7f1d1d" text-anchor="middle">T2（读到旧余额）</text>

  <rect x="480" y="236" width="150" height="30" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="555" y="255" font-size="13.5" fill="#1e3a8a" text-anchor="middle">T1</text>

  <!-- inversion arrows -->
  <path d="M 635 108 Q 520 190 260 232" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a4)"/>
  <path d="M 175 108 Q 300 190 545 232" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a3)"/>

  <text x="400" y="320" font-size="13.5" fill="#7f1d1d" text-anchor="middle" font-weight="600">顺序被颠倒：T2 排到 T1 之前 ⇒ 朋友看到旧余额</text>
  <text x="400" y="343" font-size="12.5" fill="#475569" text-anchor="middle">隔离性合法（存在等价串行序 T2 → T1），但违背真实时间——这就是非严格可串行化的缺口</text>
  <text x="400" y="365" font-size="12.5" fill="#475569" text-anchor="middle">严格可串行化禁止这种排法：T1 先完成 ⇒ T1 必须排在前</text>
</svg>
