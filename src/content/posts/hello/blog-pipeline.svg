<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">博客发布流程</title>
  <desc id="desc">Markdown 文章和图片经过 GitHub、Astro 与 GitHub Actions，发布到浏览器。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf4"/>
      <stop offset="1" stop-color="#f7e8d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#8f4a22" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#d95613"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="32" fill="url(#background)"/>
  <circle cx="1070" cy="90" r="120" fill="#f7b37f" opacity=".42"/>
  <circle cx="110" cy="540" r="155" fill="#e78a4a" opacity=".16"/>

  <text x="72" y="86" fill="#d95613" font-family="system-ui, sans-serif" font-size="24" font-weight="700" letter-spacing="4">WRITE · BUILD · PUBLISH</text>
  <text x="72" y="145" fill="#2d251f" font-family="system-ui, sans-serif" font-size="46" font-weight="750">一篇文章怎样抵达读者</text>

  <g filter="url(#shadow)" font-family="system-ui, sans-serif">
    <g transform="translate(72 238)">
      <rect width="244" height="226" rx="24" fill="#fff" stroke="#ead8c7" stroke-width="3"/>
      <rect x="30" y="30" width="62" height="78" rx="9" fill="#fff4e9" stroke="#d95613" stroke-width="3"/>
      <path d="M45 53h32M45 70h32M45 87h22" stroke="#d95613" stroke-width="5" stroke-linecap="round"/>
      <text x="30" y="154" fill="#2d251f" font-size="28" font-weight="700">Markdown</text>
      <text x="30" y="190" fill="#76675b" font-size="20">文章 · 图片 · MDX</text>
    </g>

    <g transform="translate(478 238)">
      <rect width="244" height="226" rx="24" fill="#fff" stroke="#ead8c7" stroke-width="3"/>
      <circle cx="62" cy="68" r="38" fill="#2d251f"/>
      <path d="M47 79c8 7 22 7 30 0M48 59l8-7 7 8 7-8 8 7" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="154" fill="#2d251f" font-size="28" font-weight="700">GitHub Actions</text>
      <text x="30" y="190" fill="#76675b" font-size="20">检查 · 构建 · 索引</text>
    </g>

    <g transform="translate(884 238)">
      <rect width="244" height="226" rx="24" fill="#fff" stroke="#ead8c7" stroke-width="3"/>
      <rect x="30" y="34" width="82" height="64" rx="10" fill="#fff4e9" stroke="#d95613" stroke-width="3"/>
      <path d="M38 47h66M46 63h30M46 79h50" stroke="#d95613" stroke-width="4" stroke-linecap="round"/>
      <text x="30" y="154" fill="#2d251f" font-size="28" font-weight="700">GitHub Pages</text>
      <text x="30" y="190" fill="#76675b" font-size="20">快速 · 静态 · 可迁移</text>
    </g>
  </g>

  <path d="M336 351h116" stroke="#d95613" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M742 351h116" stroke="#d95613" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <text x="72" y="550" fill="#76675b" font-family="system-ui, sans-serif" font-size="22">源文件属于你，发布流程可重复，内容随时可迁移。</text>
</svg>
